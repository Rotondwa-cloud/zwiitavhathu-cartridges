<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zwiitavhathu Cartridges – Products</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --surface: #151820;
  --surface2: #1c2030;
  --border: #252a38;
  --accent: #f97316;
  --accent-glow: rgba(249,115,22,0.18);
  --blue: #3b82f6;
  --green: #22c55e;
  --red: #ef4444;
  --text: #e8eaf0;
  --muted: #6b7280;
  --label: #9ca3af;
  --font-head: 'Syne', sans-serif;
  --font-body: 'DM Sans', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── HEADER ── */
header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(13,15,20,0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  padding: 0 40px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-family: var(--font-head);
  font-weight: 800;
  font-size: 18px;
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo span { color: var(--accent); }

header nav { display: flex; gap: 6px; }
header nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 6px;
  transition: all 0.2s;
}
header nav a:hover, header nav a.active {
  color: var(--text);
  background: var(--surface2);
}
header nav a.active { color: var(--accent); }

/* ── LAYOUT ── */
.shop-page {
  display: flex;
  min-height: calc(100vh - 64px);
}

/* ── SIDEBAR ── */
.filters {
  width: 240px;
  min-width: 240px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 28px 20px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.filter-group h4 {
  font-family: var(--font-head);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}

.filter-group label {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  color: var(--label);
  cursor: pointer;
  padding: 6px 8px;
  border-radius: 6px;
  transition: 0.15s;
  margin-bottom: 2px;
}
.filter-group label:hover { background: var(--surface2); color: var(--text); }

.filter-group input[type="checkbox"] {
  accent-color: var(--accent);
  width: 15px;
  height: 15px;
}

.filter-divider {
  height: 1px;
  background: var(--border);
}

.admin-link-btn {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--label);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  transition: 0.2s;
}
.admin-link-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── CONTENT ── */
.shop-content { flex: 1; padding: 32px 36px; overflow-x: hidden; }

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}

.page-header h1 {
  font-family: var(--font-head);
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -1px;
  line-height: 1.1;
}
.page-header h1 span { color: var(--accent); }

.header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.search-wrap {
  position: relative;
}
.search-wrap svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  width: 16px;
  height: 16px;
}
.search-wrap input {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 14px 10px 38px;
  border-radius: 8px;
  font-size: 14px;
  font-family: var(--font-body);
  width: 280px;
  transition: 0.2s;
  outline: none;
}
.search-wrap input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.search-wrap input::placeholder { color: var(--muted); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font-body);
  cursor: pointer;
  border: none;
  transition: all 0.2s;
  text-decoration: none;
  white-space: nowrap;
}
.btn-orange {
  background: var(--accent);
  color: white;
}
.btn-orange:hover { background: #ea6c0a; transform: translateY(-1px); box-shadow: 0 4px 16px var(--accent-glow); }
.btn-ghost {
  background: var(--surface2);
  color: var(--label);
  border: 1px solid var(--border);
}
.btn-ghost:hover { color: var(--text); border-color: var(--label); }

/* ── STATS BAR ── */
.stats-bar {
  display: flex;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.stat-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
}
.stat-chip .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}
.stat-chip .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
.stat-chip .dot.red { background: var(--red); box-shadow: 0 0 6px var(--red); }
.stat-chip .dot.orange { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.stat-chip strong { color: var(--text); }
.stat-chip span { color: var(--muted); }

/* ── GRID ── */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 20px;
}

/* ── CARD ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
  animation: fadeUp 0.4s ease both;
}
.card:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
  box-shadow: 0 12px 32px rgba(0,0,0,0.4), 0 0 0 1px var(--accent-glow);
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

.card-img-wrap {
  background: var(--surface2);
  display: flex;
  align-items: center;
  justify-content: center;
  height: 160px;
  position: relative;
  overflow: hidden;
}
.card-img-wrap::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(249,115,22,0.04) 0%, transparent 60%);
}
.card-img-wrap img {
  height: 120px;
  object-fit: contain;
  position: relative;
  z-index: 1;
  transition: transform 0.3s;
}
.card:hover .card-img-wrap img { transform: scale(1.06); }

.stock-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  font-size: 11px;
  font-weight: 700;
  padding: 3px 9px;
  border-radius: 20px;
  letter-spacing: 0.5px;
  z-index: 2;
}
.stock-badge.in  { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
.stock-badge.low { background: rgba(249,115,22,0.15); color: var(--accent); border: 1px solid rgba(249,115,22,0.3); }
.stock-badge.out { background: rgba(239,68,68,0.15);  color: var(--red);   border: 1px solid rgba(239,68,68,0.3); }
.stock-badge.req { background: rgba(107,114,128,0.15);color: var(--muted); border: 1px solid var(--border); }

.card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 6px; }

.card-brand {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
}
.card h3 {
  font-family: var(--font-head);
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}
.card-code {
  font-size: 11px;
  color: var(--muted);
  font-family: monospace;
  background: var(--surface2);
  padding: 2px 7px;
  border-radius: 4px;
  display: inline-block;
  width: fit-content;
}

.card-footer {
  padding: 0 16px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.price {
  font-family: var(--font-head);
  font-size: 20px;
  font-weight: 800;
  color: var(--text);
}
.price.request { font-size: 13px; color: var(--accent); font-weight: 600; }

.card-order-btn {
  padding: 8px 16px;
  border-radius: 7px;
  border: none;
  font-size: 13px;
  font-weight: 600;
  font-family: var(--font-body);
  cursor: pointer;
  transition: 0.2s;
  background: var(--accent);
  color: white;
}
.card-order-btn:hover { background: #ea6c0a; }
.card-order-btn.query {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--accent);
}
.card-order-btn.query:hover { border-color: var(--accent); background: var(--accent-glow); }
.card-order-btn:disabled {
  background: var(--surface2);
  color: var(--muted);
  cursor: not-allowed;
  border: 1px solid var(--border);
}

/* ── EMPTY STATE ── */
.empty-state {
  grid-column: 1/-1;
  text-align: center;
  padding: 80px 20px;
  color: var(--muted);
}
.empty-state svg { width: 48px; height: 48px; margin-bottom: 16px; opacity: 0.4; }
.empty-state p { font-size: 16px; }

/* ── MODAL ── */
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
  justify-content: center;
  align-items: center;
  z-index: 200;
  padding: 20px;
}
.modal-bg.open { display: flex; }

.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 30px;
  width: 100%;
  max-width: 420px;
  animation: modalIn 0.25s ease;
  box-shadow: 0 24px 60px rgba(0,0,0,0.6);
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95) translateY(10px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
}
.modal-header h2 {
  font-family: var(--font-head);
  font-size: 20px;
  font-weight: 800;
}
.modal-close {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  cursor: pointer;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: 0.2s;
}
.modal-close:hover { color: var(--text); border-color: var(--label); }

.form-group { margin-bottom: 14px; }
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  color: var(--label);
  margin-bottom: 6px;
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 11px 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
  font-family: var(--font-body);
  outline: none;
  transition: 0.2s;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.form-group select { appearance: none; cursor: pointer; }
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group input::placeholder,
.form-group textarea::placeholder { color: var(--muted); }

.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.submit-btn {
  width: 100%;
  padding: 13px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  font-family: var(--font-head);
  cursor: pointer;
  margin-top: 8px;
  transition: 0.2s;
  letter-spacing: 0.3px;
}
.submit-btn:hover { background: #ea6c0a; transform: translateY(-1px); }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 28px;
  right: 28px;
  background: var(--surface);
  border: 1px solid var(--green);
  color: var(--green);
  padding: 14px 20px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  z-index: 999;
  transform: translateY(80px);
  opacity: 0;
  transition: all 0.35s cubic-bezier(.22,1,.36,1);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.error { border-color: var(--red); color: var(--red); }

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  .shop-page { flex-direction: column; }
  .filters { width: 100%; min-width: unset; flex-direction: row; flex-wrap: wrap; padding: 16px; gap: 16px; }
  .filter-group { flex: 1; min-width: 140px; }
  .admin-link-btn { margin-top: 0; }
  .shop-content { padding: 20px; }
  header { padding: 0 20px; }
  .search-wrap input { width: 220px; }
}
@media (max-width: 500px) {
  .page-header { flex-direction: column; }
  .search-wrap input { width: 100%; }
}
</style>
</head>
<body>

<header>
  <div class="logo">🖨️ Zwiita<span>vhathu</span></div>
  <nav>
    <a href="/">Home</a>
    <a href="/products" class="active">Products</a>
    <a href="/about">About</a>
  </nav>
</header>

<div class="shop-page">
  <!-- SIDEBAR -->
  <aside class="filters">
    <div class="filter-group">
      <h4>Availability</h4>
      <label><input type="checkbox" value="in" onchange="applyFilters()"> In Stock</label>
      <label><input type="checkbox" value="low" onchange="applyFilters()"> Low Stock</label>
      <label><input type="checkbox" value="out" onchange="applyFilters()"> Out of Stock</label>
    </div>
    <div class="filter-divider"></div>
    <div class="filter-group">
      <h4>Brand</h4>
      <label><input type="checkbox" value="HP" onchange="applyFilters()"> HP</label>
      <label><input type="checkbox" value="Canon" onchange="applyFilters()"> Canon</label>
      <label><input type="checkbox" value="Epson" onchange="applyFilters()"> Epson</label>
      <label><input type="checkbox" value="Brother" onchange="applyFilters()"> Brother</label>
    </div>
    <div class="filter-divider"></div>
    <a href="/admin" class="admin-link-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Admin Dashboard
    </a>
  </aside>

  <!-- CONTENT -->
  <div class="shop-content">
    <div class="page-header">
      <div>
        <h1>Printer <span>Cartridges</span></h1>
        <p style="color:var(--muted);font-size:14px;margin-top:4px">HP · Canon · Epson · Brother & more</p>
      </div>
      <div class="header-actions">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input id="searchInput" placeholder="Search cartridge name or code…" oninput="loadProducts(this.value)">
        </div>
        <button class="btn btn-orange" onclick="openMissingModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
          Request Cartridge
        </button>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats-bar" id="statsBar">
      <div class="stat-chip"><div class="dot green"></div><strong id="statIn">–</strong><span>In Stock</span></div>
      <div class="stat-chip"><div class="dot orange"></div><strong id="statLow">–</strong><span>Low Stock</span></div>
      <div class="stat-chip"><div class="dot red"></div><strong id="statOut">–</strong><span>Out of Stock</span></div>
    </div>

    <div id="product-container" class="product-grid"></div>
  </div>
</div>

<!-- ORDER / QUERY MODAL -->
<div id="modal-bg" class="modal-bg">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Place Order</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Your Name *</label>
        <input id="customerName" placeholder="Full name">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input id="customerPhone" placeholder="Cell number">
      </div>
    </div>
    <div class="form-group">
      <label>Email *</label>
      <input id="customerEmail" type="email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Printer Brand</label>
      <select id="printerType">
        <option value="">Select brand…</option>
        <option>HP</option><option>Canon</option><option>Epson</option><option>Brother</option><option>Other</option>
      </select>
    </div>
    <div id="quantitySection" class="form-group">
      <label>Quantity</label>
      <input type="number" id="quantity" min="1" value="1">
    </div>
    <div id="notesSection" class="form-group" style="display:none">
      <label>Describe the Cartridge</label>
      <textarea id="notes" placeholder="Model number, ink type, colour…"></textarea>
    </div>

    <button class="submit-btn" id="submitOrder">Submit Request</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let allProducts = [];
let selectedProduct = null;
let isMissingRequest = false;

/* ── DATA ── */
async function loadProducts(query = "") {
  try {
    const res = await fetch(`/api/cartridges?q=${encodeURIComponent(query)}`);
    allProducts = await res.json();
    renderProducts(allProducts);
    updateStats(allProducts);
  } catch(e) {
    // Demo mode if no server
    allProducts = getDemoProducts();
    renderProducts(allProducts);
    updateStats(allProducts);
  }
}

function getDemoProducts() {
  return [
    { id:1, name:"HP 302 Black Ink Cartridge", code:"F6U66AE", brand:"HP", price:249, stock:12, image:"default.jpg" },
    { id:2, name:"HP 302 Colour Ink Cartridge", code:"F6U65AE", brand:"HP", price:299, stock:3, image:"default.jpg" },
    { id:3, name:"Canon PG-545 Black", code:"8287B004", brand:"Canon", price:279, stock:0, image:"default.jpg" },
    { id:4, name:"Epson 603 Black", code:"C13T03U14010", brand:"Epson", price:189, stock:8, image:"default.jpg" },
    { id:5, name:"Brother LC3213 Cyan", code:"LC3213C", brand:"Brother", price:229, stock:5, image:"default.jpg" },
    { id:6, name:"HP 305 Combo Pack", code:"6ZD17AE", brand:"HP", price: null, stock:0, image:"default.jpg" },
  ];
}

/* ── RENDER ── */
function renderProducts(products) {
  const container = document.getElementById("product-container");
  container.innerHTML = "";

  if (!products.length) {
    container.innerHTML = `<div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <p>No cartridges found.<br>Try a different search or <a href="#" onclick="openMissingModal()" style="color:var(--accent)">request one</a>.</p>
    </div>`;
    return;
  }

  products.forEach((p, i) => {
    const isPriceRequest = !p.price;
    const stockQty = p.stock ?? 99;
    let stockStatus, stockLabel;
    if (isPriceRequest)         { stockStatus = "req"; stockLabel = "On Request"; }
    else if (stockQty === 0)    { stockStatus = "out"; stockLabel = "Out of Stock"; }
    else if (stockQty <= 5)     { stockStatus = "low"; stockLabel = `Low — ${stockQty} left`; }
    else                         { stockStatus = "in";  stockLabel = "In Stock"; }

    const card = document.createElement("div");
    card.className = "card";
    card.style.animationDelay = `${i * 0.04}s`;

    const btnDisabled = stockStatus === "out" && !isPriceRequest ? "disabled" : "";
    const btnClass    = isPriceRequest ? "query" : "";
    const btnLabel    = isPriceRequest ? "Query Price" : stockStatus === "out" ? "Out of Stock" : "Order Now";

    card.innerHTML = `
      <div class="card-img-wrap">
        <img src="images/${p.image || 'default.jpg'}" onerror="this.src='images/default.jpg'" alt="${p.name}">
        <span class="stock-badge ${stockStatus}">${stockLabel}</span>
      </div>
      <div class="card-body">
        ${p.brand ? `<div class="card-brand">${p.brand}</div>` : ""}
        <h3>${p.name}</h3>
        ${p.code ? `<span class="card-code">${p.code}</span>` : ""}
      </div>
      <div class="card-footer">
        <div class="price ${isPriceRequest ? 'request' : ''}">
          ${isPriceRequest ? "Price on Request" : `R${Number(p.price).toFixed(2)}`}
        </div>
        <button class="card-order-btn ${btnClass}" ${btnDisabled}
          onclick="openModal(${p.id}, ${isPriceRequest})">
          ${btnLabel}
        </button>
      </div>
    `;
    container.appendChild(card);
  });
}

function updateStats(products) {
  let inn = 0, low = 0, out = 0;
  products.forEach(p => {
    if (!p.price) return;
    const s = p.stock ?? 99;
    if (s === 0) out++;
    else if (s <= 5) low++;
    else inn++;
  });
  document.getElementById("statIn").textContent  = inn;
  document.getElementById("statLow").textContent = low;
  document.getElementById("statOut").textContent = out;
}

function applyFilters() {
  const stockChecks = [...document.querySelectorAll('.filters input[value="in"], .filters input[value="low"], .filters input[value="out"]')]
    .filter(c => c.checked).map(c => c.value);
  const brandChecks = [...document.querySelectorAll('.filters input[value="HP"], .filters input[value="Canon"], .filters input[value="Epson"], .filters input[value="Brother"]')]
    .filter(c => c.checked).map(c => c.value);

  let filtered = allProducts;
  if (stockChecks.length) {
    filtered = filtered.filter(p => {
      const s = p.stock ?? 99;
      if (stockChecks.includes("in")  && s > 5)  return true;
      if (stockChecks.includes("low") && s > 0 && s <= 5) return true;
      if (stockChecks.includes("out") && s === 0) return true;
      return false;
    });
  }
  if (brandChecks.length) {
    filtered = filtered.filter(p => brandChecks.includes(p.brand));
  }
  renderProducts(filtered);
}

/* ── MODALS ── */
function openModal(id, isQueryOnly) {
  selectedProduct = { id, isQueryOnly };
  isMissingRequest = false;
  document.getElementById("modalTitle").textContent = isQueryOnly ? "Query Price" : "Place Order";
  document.getElementById("quantitySection").style.display = isQueryOnly ? "none" : "block";
  document.getElementById("notesSection").style.display    = isQueryOnly ? "block" : "none";
  document.getElementById("modal-bg").classList.add("open");
}

function openMissingModal() {
  selectedProduct = null;
  isMissingRequest = true;
  document.getElementById("modalTitle").textContent = "Request a Cartridge";
  document.getElementById("quantitySection").style.display = "none";
  document.getElementById("notesSection").style.display    = "block";
  document.getElementById("modal-bg").classList.add("open");
}

function closeModal() {
  document.getElementById("modal-bg").classList.remove("open");
}

document.getElementById("modal-bg").addEventListener("click", e => {
  if (e.target.id === "modal-bg") closeModal();
});

/* ── TOAST ── */
function showToast(msg, isError = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast" + (isError ? " error" : "") + " show";
  setTimeout(() => t.classList.remove("show"), 3500);
}

/* ── SUBMIT ── */
document.getElementById("submitOrder").addEventListener("click", async () => {
  const name  = document.getElementById("customerName").value.trim();
  const email = document.getElementById("customerEmail").value.trim();
  const phone = document.getElementById("customerPhone").value.trim();
  const brand = document.getElementById("printerType").value;
  const qty   = document.getElementById("quantity").value;
  const notes = document.getElementById("notes").value.trim();

  if (!name || !email) { showToast("Please fill in your name and email.", true); return; }

  let url, body;
  if (isMissingRequest) {
    url = "/api/request-cartridge";
    body = { name, email, phone, printerType: brand, requestedItem: notes, notes };
  } else if (selectedProduct) {
    url  = selectedProduct.isQueryOnly ? "/api/query" : "/api/order";
    body = selectedProduct.isQueryOnly
      ? { name, email, printerType: brand, productId: selectedProduct.id, notes }
      : { name, email, phone, printerType: brand, productId: selectedProduct.id, quantity: qty };
  }

  try {
    const res    = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const result = await res.json();
    if (result.success) {
      showToast("✓ Request sent successfully!");
      closeModal();
      ["customerName","customerEmail","customerPhone","notes"].forEach(id => document.getElementById(id).value = "");
      document.getElementById("printerType").value = "";
      document.getElementById("quantity").value = 1;
    } else {
      showToast(result.error || "Something went wrong.", true);
    }
  } catch(e) {
    showToast("✓ Request sent! (demo mode)", false);
    closeModal();
  }
});

loadProducts();
</script>
